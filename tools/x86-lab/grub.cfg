# 默认选择第一个菜单项，等待 3 秒，便于观察或手动编辑启动参数。
set default=0
set timeout=3

# 学习 GRUB 命令时可在菜单按 c 进入命令行；用 ls、set、cat 查看设备和变量。
# 如需 GRUB 自身的超详细日志，可临时在命令行执行 set debug=all，完成后 set debug=。

# GRUB 和 Linux 都使用 COM1 115200 串口，因此 -nographic 终端可显示全过程。
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

# 这是写入硬盘镜像 /boot/grub/grub.cfg 的唯一启动项。
menuentry "Linux 5.15 x86_64 + BusyBox (GRUB2 BIOS)" {
    # 识别 MBR 分区表；GRUB 的 ext2 模块同时支持 ext2/ext3/ext4。
    insmod part_msdos
    insmod ext2
    # 第一个硬盘的第一个 MBR 分区，对应 Linux 启动后的 /dev/sda1。
    set root=(hd0,msdos1)
    # bzImage 与根文件系统均来自硬盘，不依赖 QEMU 命令行注入。
    # 在菜单按 e，把 debug_init=1 加到下一行末尾，可让 BusyBox /init 执行 set -x。
    linux /boot/bzImage root=/dev/sda1 rw console=ttyS0,115200 init=/init
}
