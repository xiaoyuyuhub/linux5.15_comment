<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 788" role="img" aria-label="状态机：用同一 TASK_RUNNING 表示就绪与运行"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="788" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">状态机：用同一 TASK_RUNNING 表示就绪与运行</text><rect x="35" y="85" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="114" class="label">TASK_NEW</text><text x="53" y="139" class="small">创建中，还未首次唤醒</text><text class="small" x="602" y="117">wake_up_new_task 进入下一阶段</text><path class="edge" d="M302,160 L302,195"/><rect x="35" y="198" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="227" class="label">TASK_RUNNING：就绪 / 在 CPU 上运行</text><text x="53" y="252" class="small">rq-&gt;curr / on_cpu 帮助判断实际执行者</text><text class="small" x="602" y="230">被抢占时可仍保持 TASK_RUNNING</text><path class="edge" d="M302,273 L302,308"/><rect x="35" y="311" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="340" class="label">条件不满足：设置睡眠状态并等待</text><text x="53" y="365" class="small">例如空 pipe read、completion、wait</text><text class="small" x="602" y="343">在正确同步协议下重查条件</text><path class="edge" d="M302,386 L302,421"/><rect x="35" y="424" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="453" class="label">schedule：退出本轮 CPU 竞争</text><text x="53" y="478" class="small">别的任务成为 current</text><text class="small" x="602" y="456">等待者的内核栈保留续接位置</text><path class="edge" d="M302,499 L302,534"/><rect x="35" y="537" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="566" class="label">事件发生 → try_to_wake_up</text><text x="53" y="591" class="small">恢复可运行，等待调度选中</text><text class="small" x="602" y="569">唤醒不是立即完成 read</text><path class="edge" d="M302,612 L302,647"/><rect x="35" y="650" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="679" class="label">再次运行 → 重查条件 → 继续</text><text x="53" y="704" class="small">随后也可能再次等待或退出</text><text class="small" x="602" y="682">EXIT_ZOMBIE 是退出状态，非可运行态</text></svg>