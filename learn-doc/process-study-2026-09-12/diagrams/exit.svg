<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 788" role="img" aria-label="退出和回收是两位执行者的工作"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="788" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">退出和回收是两位执行者的工作</text><rect x="35" y="85" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="114" class="label">孩子：do_exit</text><text x="53" y="139" class="small">组退出处理、标记退出中</text><text class="small" x="602" y="117">不会再正常返回原用户程序</text><path class="edge" d="M302,160 L302,195"/><rect x="35" y="198" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="227" class="label">孩子：exit_mm / files / fs 等</text><text x="53" y="252" class="small">放下本任务持有的资源引用</text><text class="small" x="602" y="230">共享 mm 尚有使用者则不会整体拆掉</text><path class="edge" d="M302,273 L302,308"/><rect x="35" y="311" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="340" class="label">孩子：exit_notify</text><text x="53" y="365" class="small">通知父、重定父关系、决定 autoreap</text><text class="small" x="602" y="343">普通可等待孩子可能保留 EXIT_ZOMBIE</text><path class="edge" d="M302,386 L302,421"/><rect x="35" y="424" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="453" class="label">孩子：do_task_dead → __schedule</text><text x="53" y="478" class="small">离开自身内核栈</text><text class="small" x="602" y="456">后继任务做调度尾部释放</text><path class="edge" d="M302,499 L302,534"/><rect x="35" y="537" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="566" class="label">父：do_wait → wait_task_zombie</text><text x="53" y="591" class="small">读取退出码与统计</text><text class="small" x="602" y="569">WNOWAIT 可先观察而不回收</text><path class="edge" d="M302,612 L302,647"/><rect x="35" y="650" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="679" class="label">父/回收者：release_task</text><text x="53" y="704" class="small">脱离任务身份与关系</text><text class="small" x="602" y="682">最后引用 / RCU 完成才最终释放存储</text></svg>