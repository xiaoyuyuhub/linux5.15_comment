<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-label="task 是执行实体；资源通过指针组织"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="640" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">task 是执行实体；资源通过指针组织</text><rect x="35" y="120" width="300" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="149" class="label">task A · pid 300</text><text x="53" y="174" class="small">tgid 300 / 独立内核栈</text><rect x="35" y="310" width="300" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="339" class="label">task B · pid 301</text><text x="53" y="364" class="small">tgid 300 / 独立内核栈</text><rect x="650" y="100" width="420" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="668" y="129" class="label">同一 mm_struct</text><text x="668" y="154" class="small">VMA → 页表 → 用户物理页</text><rect x="650" y="260" width="420" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="668" y="289" class="label">共享资源对象</text><text x="668" y="314" class="small">files / fs / signal / sighand</text><rect x="650" y="420" width="420" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="668" y="449" class="label">独立执行现场</text><text x="668" y="474" class="small">thread.sp / pt_regs / 调度实体</text><path class="edge" d="M335,155 L650,140"/><path class="edge" d="M335,345 L650,140"/><path class="edge" d="M335,160 L650,295"/><path class="edge" d="M335,350 L650,295"/><text class="small" x="38" y="535">图示典型 pthread：普通 fork 会建立独立 mm；files 表也可独立但仍引用同一 struct file。</text><text class="small" x="38" y="574">共享的是资源对象；两个 task 的内核栈、TID、调度状态仍各自独立。</text></svg>