<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="shell → fork → exec → 等待回收：跨任务时序"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="800" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">shell → fork → exec → 等待回收：跨任务时序</text><rect x="15" y="80" width="210" height="55" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="33" y="109" class="label">父 shell</text><path d="M120,140 L120,745" stroke="#acbdc6" stroke-dasharray="5 6"/><rect x="290" y="80" width="210" height="55" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="308" y="109" class="label">创建/调度机制</text><path d="M395,140 L395,745" stroke="#acbdc6" stroke-dasharray="5 6"/><rect x="575" y="80" width="210" height="55" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="593" y="109" class="label">子 task</text><path d="M680,140 L680,745" stroke="#acbdc6" stroke-dasharray="5 6"/><rect x="860" y="80" width="210" height="55" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="878" y="109" class="label">ELF / 退出回收</text><path d="M965,140 L965,745" stroke="#acbdc6" stroke-dasharray="5 6"/><path class="edge" d="M120,190 L395,190"/><text class="small" text-anchor="middle" x="257.5" y="178">fork / clone</text><path class="edge" d="M395,255 L680,255"/><text class="small" text-anchor="middle" x="537.5" y="243">建立 task + 初始现场</text><path class="edge" d="M395,320 L120,320"/><text class="small" text-anchor="middle" x="257.5" y="308">父返回 child PID</text><path class="edge" d="M395,385 L680,385"/><text class="small" text-anchor="middle" x="537.5" y="373">调度后子返回 0</text><path class="edge" d="M680,450 L965,450"/><text class="small" text-anchor="middle" x="822.5" y="438">exec：安装新映像</text><path class="edge" d="M120,515 L395,515"/><text class="small" text-anchor="middle" x="257.5" y="503">wait：必要时睡眠</text><path class="edge" d="M680,580 L965,580"/><text class="small" text-anchor="middle" x="822.5" y="568">do_exit：放下资源</text><path class="edge" d="M965,645 L120,645"/><text class="small" text-anchor="middle" x="542.5" y="633">通知父 / 可收集状态</text><path class="edge" d="M120,710 L965,710"/><text class="small" text-anchor="middle" x="542.5" y="698">wait 收集 → release_task</text><text class="small" x="36" y="782">父返回与子首次执行的先后不固定；图只展示一种可能排布。</text></svg>