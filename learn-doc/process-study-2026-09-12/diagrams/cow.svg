<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" role="img" aria-label="COW：虚拟地址相同，页表独立，数据页按需分开"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="730" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">COW：虚拟地址相同，页表独立，数据页按需分开</text><rect x="35" y="100" width="410" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="129" class="label">fork 后父：mm A → PTE A</text><text x="53" y="154" class="small">VA X / 只读 → 物理页 P</text><rect x="35" y="220" width="410" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="249" class="label">fork 后子：mm B → PTE B</text><text x="53" y="274" class="small">VA X / 只读 → 物理页 P</text><rect x="745" y="160" width="330" height="100" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="763" y="189" class="label">物理页 P</text><text x="763" y="214" class="small">原始内容：P</text><path class="edge" d="M445,135 L745,185"/><path class="edge" d="M445,255 L745,225"/><text class="label" x="40" y="365">孩子写入 X → 写保护异常 → 需要复制时 wp_page_copy</text><rect x="35" y="425" width="410" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="454" class="label">父：PTE A 保留</text><text x="53" y="479" class="small">VA X → 物理页 P</text><rect x="35" y="550" width="410" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="579" class="label">子：PTE B 更新并允许写</text><text x="53" y="604" class="small">VA X → 物理页 Q</text><rect x="745" y="425" width="330" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="763" y="454" class="label">物理页 P</text><text x="763" y="479" class="small">父仍读到 P</text><rect x="745" y="550" width="330" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="763" y="579" class="label">物理页 Q</text><text x="763" y="604" class="small">复制后孩子写成 C</text><path class="edge" d="M445,462 L745,462"/><path class="edge" d="M445,587 L745,587"/><text class="small" x="38" y="685">本图限定典型私有匿名页复制分支；独占页可复用，MAP_SHARED / 大页另有路径。</text></svg>