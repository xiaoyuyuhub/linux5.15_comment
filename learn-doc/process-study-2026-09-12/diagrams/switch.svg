<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-label="上下文切换：先协调地址空间，再交接内核栈"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="740" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">上下文切换：先协调地址空间，再交接内核栈</text><rect x="30" y="95" width="470" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="48" y="124" class="label">轨道一：地址空间</text><text x="48" y="149" class="small">context_switch → 根据 next-&gt;mm 分支</text><rect x="605" y="95" width="470" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="623" y="124" class="label">轨道二：执行现场</text><text x="623" y="149" class="small">switch_to → __switch_to_asm</text><rect x="30" y="235" width="470" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="48" y="264" class="label">next 有用户 mm</text><text x="48" y="289" class="small">switch_mm_irqs_off / 同 mm 优化</text><rect x="605" y="235" width="470" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="623" y="264" class="label">保存 prev 的 RSP</text><text x="623" y="289" class="small">prev-&gt;thread.sp = 当前内核栈位置</text><rect x="30" y="375" width="470" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="48" y="404" class="label">next 无用户 mm</text><text x="48" y="429" class="small">借用 / 转交 prev-&gt;active_mm</text><rect x="605" y="375" width="470" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="623" y="404" class="label">装入 next 的 RSP</text><text x="623" y="429" class="small">以后 pop / 返回读取 next 的栈</text><rect x="320" y="560" width="500" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="338" y="589" class="label">finish_task_switch / 新任务 schedule_tail</text><text x="338" y="614" class="small">处理锁、旧借用 mm、死任务的相关引用</text><path class="edge" d="M265,170 L265,232"/><path class="edge" d="M840,170 L840,232"/><path class="edge" d="M840,310 L840,372"/><path class="edge" d="M265,450 L470,556"/><path class="edge" d="M840,450 L670,556"/><text class="small" x="35" y="697">左侧两个框是条件分支，不是先后都执行；右侧保存和装入则有严格顺序。</text></svg>