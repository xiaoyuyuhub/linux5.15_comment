<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 901" role="img" aria-label="从启动静态任务到用户进程回收"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="901" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">从启动静态任务到用户进程回收</text><rect x="35" y="85" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="114" class="label">init_task · PID 0</text><text x="53" y="139" class="small">静态对象、内核栈、init_mm</text><text class="small" x="602" y="117">起点不是 fork：对象在编译链接时存在</text><path class="edge" d="M302,160 L302,195"/><rect x="35" y="198" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="227" class="label">start_kernel → rest_init</text><text x="53" y="252" class="small">调度 / PID / 对象缓存已准备</text><text class="small" x="602" y="230">PID 0 分别创建 PID 1 与 PID 2</text><path class="edge" d="M302,273 L302,308"/><rect x="35" y="311" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="340" class="label">PID 1: kernel_init → kernel_execve</text><text x="53" y="365" class="small">从内核启动任务进入用户 init</text><text class="small" x="602" y="343">PID 2 kthreadd 处理另一条内核线程分支</text><path class="edge" d="M302,386 L302,421"/><rect x="35" y="424" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="453" class="label">shell → fork / clone</text><text x="53" y="478" class="small">创建 task、资源、初始执行现场</text><text class="small" x="602" y="456">wake_up_new_task 让孩子可运行</text><path class="edge" d="M302,499 L302,534"/><rect x="35" y="537" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="566" class="label">子任务 → execve → 新应用</text><text x="53" y="591" class="small">新 mm、ELF 映射、用户入口</text><text class="small" x="602" y="569">普通单线程情形下进程 PID 保留</text><path class="edge" d="M302,612 L302,647"/><rect x="35" y="650" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="679" class="label">运行 ↔ 等待 ↔ 唤醒</text><text x="53" y="704" class="small">rq 选择；页表 / 内核栈切换</text><text class="small" x="602" y="682">内存访问可触发缺页 / COW</text><path class="edge" d="M302,725 L302,760"/><rect x="35" y="763" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="792" class="label">do_exit → zombie → wait</text><text x="53" y="817" class="small">先释放使用资源，再收集退出状态</text><text class="small" x="602" y="795">最后引用和 RCU 决定结构最终释放</text></svg>