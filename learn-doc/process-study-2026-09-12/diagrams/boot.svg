<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 788" role="img" aria-label="0 / 1 / 2 号任务：创建顺序与同步"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="788" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">0 / 1 / 2 号任务：创建顺序与同步</text><rect x="35" y="85" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="114" class="label">PID 0: rest_init</text><text x="53" y="139" class="small">kernel_thread(kernel_init, NULL, CLONE_FS)</text><text class="small" x="602" y="117">创建 PID 1；它可能已被调度</text><path class="edge" d="M302,160 L302,195"/><rect x="35" y="198" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="227" class="label">PID 1: kernel_init</text><text x="53" y="252" class="small">wait_for_completion(kthreadd_done)</text><text class="small" x="602" y="230">未完成时睡眠，不推进依赖初始化</text><path class="edge" d="M302,273 L302,308"/><rect x="35" y="311" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="340" class="label">PID 0: 创建 kthreadd</text><text x="53" y="365" class="small">记录 kthreadd_task（PID 2）</text><text class="small" x="602" y="343">这是创建分叉，不是 PID 1 调用 PID 2</text><path class="edge" d="M302,386 L302,421"/><rect x="35" y="424" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="453" class="label">PID 0: complete(kthreadd_done)</text><text x="53" y="478" class="small">进入 schedule / idle</text><text class="small" x="602" y="456">允许 PID 1 继续，不等 PID 2 执行结束</text><path class="edge" d="M302,499 L302,534"/><rect x="35" y="537" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="566" class="label">PID 1: kernel_init_freeable</text><text x="53" y="591" class="small">SMP / initcalls / rootfs 等</text><text class="small" x="602" y="569">完成初始化、回收 init 内存</text><path class="edge" d="M302,612 L302,647"/><rect x="35" y="650" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="679" class="label">PID 1: kernel_execve</text><text x="53" y="704" class="small">安装用户 mm 和寄存器入口</text><text class="small" x="602" y="682">ret_from_fork 衔接返回用户态</text></svg>