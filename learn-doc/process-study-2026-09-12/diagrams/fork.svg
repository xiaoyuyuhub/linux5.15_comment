<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 901" role="img" aria-label="copy_process：构造、发布、初次唤醒"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35758b" stroke-width="1.6"/></marker></defs><rect width="1120" height="901" rx="20" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18384b}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:17px}.edge{stroke:#35758b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text class="title" x="36" y="47">copy_process：构造、发布、初次唤醒</text><rect x="35" y="85" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="114" class="label">校验 flags / namespace / 信号</text><text x="53" y="139" class="small">不合法组合尽早返回错误</text><text class="small" x="602" y="117">CLONE_THREAD → SIGHAND → VM</text><path class="edge" d="M302,160 L302,195"/><rect x="35" y="198" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="227" class="label">dup_task_struct</text><text x="53" y="252" class="small">新 task + 独立内核栈</text><text class="small" x="602" y="230">复制父模板之后，逐项重建私有状态</text><path class="edge" d="M302,273 L302,308"/><rect x="35" y="311" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="340" class="label">计数 / 凭据 / sched_fork</text><text x="53" y="365" class="small">限制、锁、统计、TASK_NEW</text><text class="small" x="602" y="343">初始化期间不允许普通运行</text><path class="edge" d="M302,386 L302,421"/><rect x="35" y="424" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="453" class="label">copy_* 资源 + copy_thread</text><text x="53" y="478" class="small">复制或共享，构造初始内核栈框架</text><text class="small" x="602" y="456">失败从 bad_fork_* 逆序释放已得资源</text><path class="edge" d="M302,499 L302,534"/><rect x="35" y="537" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="566" class="label">分配 PID / 建立组和父关系</text><text x="53" y="591" class="small">锁保护下让新任务可见</text><text class="small" x="602" y="569">可见不等于此时已经执行用户代码</text><path class="edge" d="M302,612 L302,647"/><rect x="35" y="650" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="679" class="label">返回 kernel_clone</text><text x="53" y="704" class="small">记录 fork 事件、取得 PID 引用</text><text class="small" x="602" y="682">唤醒后孩子可能很快退出</text><path class="edge" d="M302,725 L302,760"/><rect x="35" y="763" width="535" height="74" rx="12" fill="#e0eef3" stroke="#a9c7d1"/><text x="53" y="792" class="label">wake_up_new_task</text><text x="53" y="817" class="small">TASK_RUNNING → 入队 → 判断抢占</text><text class="small" x="602" y="795">未来调度到 ret_from_fork</text></svg>